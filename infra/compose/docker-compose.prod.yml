# Vidyanexa on one server:  cp .env.prod.example .env.prod  (fill it in), then
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
# Open http://<server address>/ . See docs/DEPLOYMENT.md.
name: eduvia-prod

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: eduvia
      POSTGRES_PASSWORD: ${OWNER_DB_PASSWORD:?set OWNER_DB_PASSWORD}
      POSTGRES_DB: eduvia
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./postgres-init-prod:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eduvia -d eduvia"]
      interval: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 30

  api:
    build: ../../api
    restart: unless-stopped
    env_file: .env.prod
    environment:
      DATABASE_URL: postgresql+asyncpg://eduvia_app:${APP_DB_PASSWORD}@postgres:5432/eduvia
      MIGRATION_DATABASE_URL: postgresql+asyncpg://eduvia:${OWNER_DB_PASSWORD}@postgres:5432/eduvia
      REDIS_URL: redis://redis:6379/0
      STORAGE_DIR: /data/storage
      APP_URL: ${PUBLIC_URL}
      API_PUBLIC_URL: ${PUBLIC_URL}
      CORS_ORIGINS: ${PUBLIC_URL}
    volumes:
      - api_storage:/data/storage    # uploaded files and backups
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  web:
    build:
      context: ../../web
      args:
        NEXT_PUBLIC_SITE_URL: ${PUBLIC_URL:?set PUBLIC_URL}
        NEXT_PUBLIC_GA_ID: ${GA_ID:-}
        API_URL: http://api:8000
    restart: unless-stopped
    environment:
      API_URL: http://api:8000
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
    depends_on:
      api: { condition: service_healthy }

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports: ["${HTTP_PORT:-80}:80"]
    volumes:
      - ../nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [web, api]

volumes:
  pg_data:
  redis_data:
  api_storage:
