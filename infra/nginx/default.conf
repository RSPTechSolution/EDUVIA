# One address for everything: the website and web app at /, the API at /api/v1 (used by the mobile apps and public
# files such as school logos), and /iclock for biometric attendance machines (ZKTeco ADMS).
upstream eduvia_web { server web:3000; }
upstream eduvia_api { server api:8000; }

server {
    listen 80 default_server;
    server_name _;
    client_max_body_size 25m;          # uploads (documents, photos, imports)
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;

    location /api/v1/ { proxy_pass http://eduvia_api; }
    location /iclock  { proxy_pass http://eduvia_api; }
    location /_next/static/ {
        proxy_pass http://eduvia_web;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location / { proxy_pass http://eduvia_web; }
}
